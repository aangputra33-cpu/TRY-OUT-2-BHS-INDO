        <div class="legend"><span><i style="background:var(--ans-bg)"></i>Sudah dijawab</span><span><i style="background:var(--dbt-bg)"></i>Ragu-ragu</span><span><i style="background:var(--un-bg)"></i>Belum dijawab</span></div>
      </div>
      <button class="btn btn-main" data-act="ask">Akhiri Ujian</button>
    </aside>
  </div>
  ${S.confirm?confirmHtml(c):''}`;
}
function confirmHtml(c){
  return `<div class="ov" role="dialog" aria-modal="true" aria-labelledby="ct"><div class="modal">
    <h2 id="ct">Akhiri ujian sekarang?</h2>
    <p style="margin:0;color:var(--muted)">${c.u+c.d>0?'Masih ada soal yang belum final. Periksa dulu jika waktu masih ada.':'Semua soal sudah dijawab.'}</p>
    <div class="stat3"><div class="a"><b>${c.a}</b><small>Dijawab</small></div><div class="d"><b>${c.d}</b><small>Ragu-ragu</small></div><div class="u"><b>${c.u}</b><small>Belum</small></div></div>
    <div class="btns"><button class="btn btn-ghost" data-act="cancel">Kembali</button><button class="btn btn-main" data-act="confirm">Ya, selesaikan</button></div></div></div>`;
}
function go(i){ S.idx=Math.max(0,Math.min(TOTAL-1,i)); renderExam(); const el=$('#qcard'); if(el){ el.scrollIntoView({block:'start'}); } }

/* ---------- Hasil ---------- */
function finish(){
  clearInterval(tick); tick=null;
  S.finishedAt=Math.min(Date.now(), S.endAt);
  S.screen='result'; S.confirm=false; S.filter='all';
  renderResult(); window.scrollTo(0,0);
}
function result(){
  let benar=0,salah=0,kosong=0;
  Q.forEach((q,i)=>{ const a=S.ans[i]; if(a===undefined) kosong++; else if(a===q.ans) benar++; else salah++; });
  return { benar, salah, kosong, nilai: Math.round(benar/TOTAL*1000)/10 };
}
function renderResult(){
  const r=result(), u=S.user;
  const pred = r.nilai>=85?'Sangat Baik':r.nilai>=70?'Baik':r.nilai>=55?'Cukup':'Perlu Belajar Lagi';
  const circ = 2*Math.PI*74;
  const used = S.finishedAt - S.startedAt;
  const list = Q.map((q,i)=>({q,i,a:S.ans[i]})).filter(x=>{
    const st = x.a===undefined?'kosong':(x.a===x.q.ans?'benar':'salah');
    x.st=st; return S.filter==='all'||S.filter===st;
  });
  $('#app').innerHTML = `
  <div class="res">
    <section class="score">
      <span class="badge" style="background:rgba(255,255,255,.2);padding:6px 14px;border-radius:99px;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase">Nilai akhir</span>
      <div class="ring"><svg viewBox="0 0 170 170" aria-hidden="true"><circle cx="85" cy="85" r="74" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="14"/><circle cx="85" cy="85" r="74" fill="none" stroke="#ffce3c" stroke-width="14" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-r.nilai/100)}"/></svg>
        <div class="c"><b>${String(r.nilai).replace('.',',')}</b><small>dari 100</small></div></div>
      <div class="predikat">${pred}</div>
      <small style="color:#e3e8ff">${S.auto?'Waktu habis, jawaban dikumpulkan otomatis':'Waktu dipakai '+fmt(used)}</small>
    </section>
    <section class="info">
      <h2>${esc(u.nama)}</h2>
      <dl class="dl">
        <div><dt>Kelas</dt><dd>${esc(u.kelas)}</dd></div>
        <div><dt>Peserta Didik</dt><dd>${esc(u.peserta)}</dd></div>
        <div style="grid-column:1/-1"><dt>Asal Sekolah</dt><dd>${esc(u.sekolah)}</dd></div>
      </dl>
      <div class="chips"><span class="pill g">Benar ${r.benar}</span><span class="pill b">Salah ${r.salah}</span><span class="pill u">Tidak dijawab ${r.kosong}</span></div>
      <p class="note" style="margin:0">Nilai = jumlah benar ÷ ${TOTAL} soal × 100. Kunci jawaban disusun mandiri dan sebagian soal bisa berbeda dari kunci resmi.</p>
      <div class="foot"><button class="btn btn-main" data-act="again">Ulangi Try Out</button><button class="btn btn-ghost" data-act="topem">Lihat pembahasan ↓</button></div>
    </section>
  </div>
  <h2 class="sec-t" id="pem">Pembahasan soal</h2>
  <div class="filters" role="group" aria-label="Filter pembahasan">
    ${[['all','Semua ('+TOTAL+')'],['benar','Benar ('+r.benar+')'],['salah','Salah ('+r.salah+')'],['kosong','Tidak dijawab ('+r.kosong+')']].map(([k,t])=>`<button class="fbtn" data-act="filter" data-k="${k}" aria-pressed="${S.filter===k}">${t}</button>`).join('')}
  </div>
  ${list.length?list.map(({q,i,a,st})=>`
  <article class="rv ${st==='benar'?'ok':st==='salah'?'no':''}">
    <header><h3>Soal ${q.id}</h3><span class="pill ${st==='benar'?'g':st==='salah'?'b':'u'}">${st==='benar'?'Benar':st==='salah'?'Salah':'Tidak dijawab'}</span></header>
    ${q.ctx?`<details><summary>Lihat bacaan soal</summary><div class="ctx">${q.ctx}</div></details>`:''}
    <p class="stem">${esc(q.stem)}</p>
    ${q.opts.map((o,k)=>`<div class="ropt${k===q.ans?' key':''}${a===k&&k!==q.ans?' mine':''}"><span class="l">${LET[k]}</span><span class="t">${o}</span>${k===q.ans?'<em style="color:var(--good)">Kunci</em>':''}${a===k&&k!==q.ans?'<em style="color:var(--bad)">Jawabanmu</em>':''}${a===k&&k===q.ans?'<em style="color:var(--good)">· Jawabanmu</em>':''}</div>`).join('')}
    <div class="exp"><b>Pembahasan · kunci ${LET[q.ans]}</b><p>${esc(q.exp)}</p></div>
  </article>`).join(''):'<div class="card empty">Tidak ada soal pada kategori ini.</div>'}`;
}

/* ---------- Event ---------- */
document.addEventListener('click', (e)=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, i=Number(b.dataset.i);
  if(S.screen==='exam'){
    if(act==='pick'){ S.ans[S.idx]=i; renderExam(); }
    else if(act==='clear'){ delete S.ans[S.idx]; renderExam(); }
    else if(act==='prev') go(S.idx-1);
    else if(act==='next') go(S.idx+1);
    else if(act==='doubt'){ S.doubt[S.idx]=!S.doubt[S.idx]; if(!S.doubt[S.idx]) delete S.doubt[S.idx]; renderExam(); }
    else if(act==='go') go(i);
    else if(act==='ask'||act==='finish'){ S.confirm=true; renderExam(); }
    else if(act==='cancel'){ S.confirm=false; renderExam(); }
    else if(act==='confirm') finish();
  } else if(S.screen==='result'){
    if(act==='filter'){ S.filter=b.dataset.k; renderResult(); document.getElementById('pem').scrollIntoView(); }
    else if(act==='topem') document.getElementById('pem').scrollIntoView({behavior:'smooth'});
    else if(act==='again'){ S.screen='start'; renderStart(); window.scrollTo(0,0); }
  }
});
document.addEventListener('keydown', (e)=>{
  if(S.screen!=='exam'||S.confirm) return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight') go(S.idx+1); else if(e.key==='ArrowLeft') go(S.idx-1);
});
renderStart();
</script>

</body></html>
