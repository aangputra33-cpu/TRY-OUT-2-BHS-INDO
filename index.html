<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Try Out TKA Bahasa Indonesia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Konsep: ruang ujian berwarna. Header ungu-biru sebagai identitas, tiga warna status (hijau, kuning, abu) untuk nomor soal. */
:root{
  --bg:#f1efff; --surface:#ffffff; --surface2:#f6f5ff; --fg:#1d1a3d; --muted:#625f8c; --line:#dedaf7;
  --primary:#5b3df5; --primary2:#2f7bff; --primary-soft:#ece8ff; --on-primary:#ffffff;
  --ans-bg:#047857; --ans-fg:#ffffff; --dbt-bg:#fbbf24; --dbt-fg:#3a2600; --un-bg:#e9e7fa; --un-fg:#3b3866;
  --good:#047857; --good-soft:#d9f5e8; --bad:#c81e4b; --bad-soft:#ffe1e9; --warn-soft:#fff2cc;
  --shadow:0 8px 28px rgba(60,40,160,.12);
  --font-d:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12102b; --surface:#1d1a42; --surface2:#262253; --fg:#ecebff; --muted:#a9a6d6; --line:#37337a;
  --primary:#8f7dff; --primary2:#5aa0ff; --primary-soft:#2d2870; --on-primary:#14102e;
  --ans-bg:#10b981; --ans-fg:#04281d; --dbt-bg:#fbbf24; --dbt-fg:#3a2600; --un-bg:#2d2a5e; --un-fg:#d7d5ff;
  --good:#4ade9a; --good-soft:#12382b; --bad:#ff7a9c; --bad-soft:#47182b; --warn-soft:#3f3210;
  --shadow:0 8px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12102b; --surface:#1d1a42; --surface2:#262253; --fg:#ecebff; --muted:#a9a6d6; --line:#37337a;
  --primary:#8f7dff; --primary2:#5aa0ff; --primary-soft:#2d2870; --on-primary:#14102e;
  --ans-bg:#10b981; --ans-fg:#04281d; --dbt-bg:#fbbf24; --dbt-fg:#3a2600; --un-bg:#2d2a5e; --un-fg:#d7d5ff;
  --good:#4ade9a; --good-soft:#12382b; --bad:#ff7a9c; --bad-soft:#47182b; --warn-soft:#3f3210;
  --shadow:0 8px 28px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.55;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary2);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);line-height:1.15;margin:0;text-wrap:balance}

/* ---------- Layar awal ---------- */
.start{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:0;margin-top:24px;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.hero{background:linear-gradient(150deg,#5b3df5 0%,#3b5bff 55%,#14b8e6 100%);color:#fff;padding:40px 36px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;bottom:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;right:70px;bottom:120px;width:90px;height:90px;border-radius:50%;background:rgba(255,206,60,.55)}
.badge{align-self:flex-start;background:rgba(255,255,255,.2);padding:6px 14px;border-radius:99px;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:clamp(34px,5vw,52px);font-weight:800;color:#fff}
.hero p{margin:0;max-width:34ch;font-size:16px;color:#eef0ff}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;position:relative;z-index:1}
.fact{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 14px;min-width:96px}
.fact b{display:block;font-family:var(--font-d);font-size:24px;line-height:1.1}
.fact span{font-size:12.5px;color:#e6e9ff}
.formbox{padding:34px 34px 30px;display:flex;flex-direction:column;gap:16px}
.formbox h2{font-size:26px}
.formbox .sub{margin:-8px 0 0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:13.5px}
.field input,.field select{background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;width:100%}
.field input:focus,.field select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 4px var(--primary-soft)}
.field.err input{border-color:var(--bad)}
.field .msg{color:var(--bad);font-size:12.5px;min-height:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(1px)}
.btn-main{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 8px 20px rgba(70,70,240,.35)}
.btn-ghost{background:var(--surface2);border:2px solid var(--line)}
.btn-dbt{background:var(--surface2);border:2px solid var(--dbt-bg)}
.btn-dbt[aria-pressed="true"]{background:var(--dbt-bg);color:var(--dbt-fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.note{font-size:12.5px;color:var(--muted)}

/* ---------- Ujian ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-top:12px;background:linear-gradient(120deg,#4d34e8,#2f6bff);color:#fff;border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:#ffce3c;color:#3a2600;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:18px}
.who div{min-width:0}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dfe4ff;font-size:12.5px}
.timer{flex:none;background:rgba(255,255,255,.2);border-radius:12px;padding:6px 12px;text-align:center;line-height:1.1}
.timer small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#e3e7ff}
.timer b{font-family:var(--font-d);font-size:22px;font-variant-numeric:tabular-nums}
.timer.low{background:#ff4d6d;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.timer.low{animation:none}}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;margin-top:16px;align-items:start}
.card{background:var(--surface);border-radius:20px;padding:22px;box-shadow:var(--shadow);min-width:0}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.qno{font-family:var(--font-d);font-weight:800;font-size:22px}
.qno span{color:var(--muted);font-weight:600;font-size:15px}
.prog{height:8px;background:var(--un-bg);border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ans-bg),#22d3ee);border-radius:99px;transition:width .3s}
.ctx{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;max-height:340px;overflow:auto;font-family:Georgia,'Times New Roman',serif;font-size:15.5px}
.ctx p{margin:0 0 10px;text-align:left}
.ctx p:last-child{margin-bottom:0}
.ctx .ctx-t{font-family:var(--font-b);font-weight:700;font-size:13px;color:var(--primary)}
.ctx .poem-t{text-align:center;font-size:15px;letter-spacing:.08em}
.ctx .ctx-a,.ctx .ctx-c{text-align:center;font-style:italic}
.ctx .ctx-src{text-align:right;font-style:italic;color:var(--muted)}
.ctx .poem{padding-left:12px;border-left:4px solid var(--primary-soft)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-family:var(--font-b);font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.tbl th{background:var(--primary-soft)}
.stem{font-size:16.5px;font-weight:600;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--primary)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--un-bg);color:var(--un-fg);font-weight:800;font-size:14px}
.opt .t{min-width:0;overflow-wrap:anywhere;padding-top:3px}
.opt[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-checked="true"] .l{background:var(--primary);color:var(--on-primary)}
.clear{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 2px;margin-top:8px;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:14px}
.side h3{font-size:18px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.n{height:44px;border-radius:12px;border:2px solid transparent;font-weight:800;background:var(--un-bg);color:var(--un-fg)}
.n.ans{background:var(--ans-bg);color:var(--ans-fg)}
.n.dbt{background:var(--dbt-bg);color:var(--dbt-fg)}
.n.cur{border-color:var(--fg);box-shadow:0 0 0 3px var(--primary-soft)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;text-align:center}
.stat3 div{border-radius:12px;padding:8px 4px}
.stat3 b{display:block;font-family:var(--font-d);font-size:22px;line-height:1.1}
.stat3 small{font-size:11.5px}
.stat3 .a{background:var(--ans-bg);color:var(--ans-fg)}
.stat3 .d{background:var(--dbt-bg);color:var(--dbt-fg)}
.stat3 .u{background:var(--un-bg);color:var(--un-fg)}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;background:rgba(15,10,50,.6);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:22px;padding:26px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal h2{font-size:24px;margin-bottom:8px}
.modal .stat3{margin:16px 0}
.modal .btns{display:flex;gap:10px;flex-wrap:wrap}
.modal .btns .btn{flex:1}

/* ---------- Hasil ---------- */
.res{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:0;margin-top:20px;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.score{background:linear-gradient(160deg,#5b3df5,#2f7bff 70%,#14b8e6);color:#fff;padding:30px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center}
.ring b{font-family:var(--font-d);font-size:46px;font-weight:800;line-height:1}
.ring small{font-size:12.5px;color:#e3e8ff}
.predikat{font-family:var(--font-d);font-size:22px;font-weight:800}
.info{padding:28px 30px;display:flex;flex-direction:column;gap:18px;min-width:0}
.info h2{font-size:28px;overflow-wrap:anywhere}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0}
.dl dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{border-radius:99px;padding:6px 14px;font-weight:700;font-size:13.5px}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.b{background:var(--bad-soft);color:var(--bad)}
.pill.u{background:var(--un-bg);color:var(--un-fg)}
.pill.w{background:var(--warn-soft);color:var(--fg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 14px}
.fbtn{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:700}
.fbtn[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sec-t{font-size:26px;margin-top:28px}
.rv{background:var(--surface);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow);border-left:8px solid var(--un-bg)}
.rv.ok{border-left-color:var(--ans-bg)}
.rv.no{border-left-color:var(--bad)}
.rv header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.rv header h3{font-size:20px}
.rv details{margin-bottom:12px}
.rv summary{cursor:pointer;font-weight:700;color:var(--primary);margin-bottom:8px}
.ropt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;background:var(--surface2)}
.ropt .l{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--un-bg);color:var(--un-fg);font-weight:800;font-size:13px}
.ropt .t{min-width:0;overflow-wrap:anywhere;padding-top:2px}
.ropt.key{border-color:var(--good);background:var(--good-soft)}
.ropt.key .l{background:var(--good);color:var(--surface)}
.ropt.mine{border-color:var(--bad);background:var(--bad-soft)}
.ropt.mine .l{background:var(--bad);color:var(--surface)}
.ropt em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;white-space:nowrap;padding-top:3px}
.exp{background:var(--primary-soft);border-radius:14px;padding:14px 16px;margin-top:12px}
.exp b{display:block;margin-bottom:4px;color:var(--primary)}
.exp p{margin:0}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.empty{padding:30px;text-align:center;color:var(--muted)}

@media (max-width:900px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .start,.res{grid-template-columns:minmax(0,1fr)}
  .hero{padding:28px 24px}
  .hero p{max-width:none}
}
@media (max-width:520px){
  .formbox{padding:24px 18px}
  .row2{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr 1fr}
  .actions .btn-dbt{grid-column:1/-1;order:3}
  .card{padding:16px}
  .dl{grid-template-columns:1fr}
  .info{padding:22px 18px}
  .timer b{font-size:19px}
}
</style>

<div class="wrap" id="app"></div>

<script>
const Q = [{"id":1,"orig":1,"ctx":"\u003cp class=\"ctx-t poem-t\">SAWAH\u003c/p>\u003cp class=\"ctx-a\">A. Hasjmy\u003c/p>\u003cp class=\"poem\">Sawah tersusun di lereng gunung.\u003cbr>Berpagar dengan bukit Barisan.\u003cbr>Sayup-sayup ujung ke ujung\u003cbr>Padi mudanya hijau berdandan\u003c/p>\u003cp class=\"poem\">Di dangau perawan duduk menyulam\u003cbr>Matanya memandang padi huma\u003cbr>Sekali-sekali ia bernyanyi\u003cbr>Dipetik dari hati mudanya\u003c/p>\u003cp class=\"poem\">Kalau turun pipit berkawan\u003cbr>Merayap hinggap di mayang padi\u003cbr>Terdengar teriak suara perawan\u003cbr>Menyuruh pipit menjauhkan diri\u003c/p>\u003cp class=\"poem\">Kalau pipit sudah terbang\u003cbr>Melayang hilang pulang ke rimba\u003cbr>Perawan menyanyi menembang tembang\u003cbr>Menyesali pipit tak tahu iba\u003c/p>\u003cp class=\"poem\">Mengapa engkau aduhai pipit\u003cbr>Tak tahu diiba kasihan\u003cbr>Badanku payah menanggung sakit\u003cbr>Mencucur keringat sepanjang zaman\u003cbr>Padi ku pupuk sejak semula\u003c/p>","stem":"Makna kata pipit pada puisi tersebut adalah ....","opts":["penipu","pemberani","penghasut","penjajah","pemberontak"],"ans":3,"exp":"Pipit adalah burung pemakan padi yang datang berkawan-kawan dan merusak padi yang ditanam dengan susah payah. Dalam puisi ini pipit dipakai sebagai lambang (kiasan) penjajah yang mengambil hasil jerih payah rakyat/petani, sehingga maknanya adalah penjajah."},{"id":2,"orig":2,"ctx":"\u003cp class=\"ctx-t poem-t\">SAWAH\u003c/p>\u003cp class=\"ctx-a\">A. Hasjmy\u003c/p>\u003cp class=\"poem\">Sawah tersusun di lereng gunung.\u003cbr>Berpagar dengan bukit Barisan.\u003cbr>Sayup-sayup ujung ke ujung\u003cbr>Padi mudanya hijau berdandan\u003c/p>\u003cp class=\"poem\">Di dangau perawan duduk menyulam\u003cbr>Matanya memandang padi huma\u003cbr>Sekali-sekali ia bernyanyi\u003cbr>Dipetik dari hati mudanya\u003c/p>\u003cp class=\"poem\">Kalau turun pipit berkawan\u003cbr>Merayap hinggap di mayang padi\u003cbr>Terdengar teriak suara perawan\u003cbr>Menyuruh pipit menjauhkan diri\u003c/p>\u003cp class=\"poem\">Kalau pipit sudah terbang\u003cbr>Melayang hilang pulang ke rimba\u003cbr>Perawan menyanyi menembang tembang\u003cbr>Menyesali pipit tak tahu iba\u003c/p>\u003cp class=\"poem\">Mengapa engkau aduhai pipit\u003cbr>Tak tahu diiba kasihan\u003cbr>Badanku payah menanggung sakit\u003cbr>Mencucur keringat sepanjang zaman\u003cbr>Padi ku pupuk sejak semula\u003c/p>","stem":"Maksud yang terkandung dalam puisi tersebut adalah ....","opts":["Penipuan yang dilakukan secara bersama-sama","Keberanian orang apabila dia sudah berkelompok","Sifat orang yang suka sekali mengadu domba antarsesama","Penjajah yang sewenang-wenang mengambil hak bangsa kita","Pemberontakan yang dilakukan secara beramai-ramai"],"ans":3,"exp":"Petani (perawan) sudah bekerja keras memupuk padi, tetapi pipit yang berkawan-kawan datang memakan hasilnya tanpa belas kasihan. Karena pipit melambangkan penjajah, maksud puisi adalah penjajah yang sewenang-wenang mengambil hak bangsa kita."},{"id":3,"orig":4,"ctx":"\u003cp class=\"poem\">Mengapa engkau aduhai pipit\u003cbr>Tak tahu diiba kasihan\u003cbr>Badanku payah menanggung sakit\u003cbr>Mencucur keringat sepanjang zaman\u003cbr>Padi ku pupuk sejak semula\u003c/p>","stem":"Tema puisi tersebut adalah ....","opts":["penindasan hak orang lain","sifat mengadu domba","perlawanan terhadap musuh","penyesalan tak berguna","keberanian melawan musuh"],"ans":0,"exp":"Bait tersebut menggambarkan aku lirik yang sudah bersusah payah memupuk padi, tetapi hasilnya dirampas oleh pipit yang “tak tahu iba”. Inti yang dibicarakan adalah perampasan/penindasan terhadap hak orang lain. Tidak ada unsur mengadu domba, perlawanan, atau keberanian melawan musuh dalam bait ini."},{"id":4,"orig":5,"ctx":"\u003cp class=\"ctx-t\">Kutipan novel berikut untuk soal nomor 5 s.d. 7. Bacalah dengan cermat!\u003c/p>\u003cp>(1) Haji Junaedi memperlihatkan surat yang masih dipegangnya itu kepada isterinya. (2) Nyai Salamah terkejut, ternganga mulutnya dan pucat warna mukanya. (3) “Engkau suka bermenantukan manteri itu?” tanya suaminya dengan tenang. (4) “Bermenantukan orang tua, yang berbini dan beranak itu? Daripada anakku bermadu, lebih baik tiada berlaki selama-lamanya. (5) Tidak, Akang, saya tidak mengharapkan pangkat, harta, hanya kesenangan anak saya. (6) Rupanya ia suka kepada siapa gerangan orang itu? Den Kosim, ya, benar! Bagaimana rundingan dengan Juragan Patih, Akang?” (7) “Belum ada keputusannya.” (8) “Lebih baik hal itu Akang segerakan, ulang rundingan dengan Juragan Patih. Katakan bahwa kita sudah siap.”\u003c/p>\u003cp class=\"ctx-src\">Katak Hendak Jadi Lembu, Nur Sutan Iskandar\u003c/p>","stem":"Sudut pandang yang digunakan dalam penggalan novel tersebut adalah ....","opts":["orang pertama pelaku utama","orang pertama pelaku sampingan","orang ketiga serbatahu","orang ketiga pelaku utama","orang ketiga pelaku sampingan"],"ans":4,"exp":"Pengarang menyebut tokoh dengan nama (Haji Junaedi, Nyai Salamah) dan tidak memakai kata “aku”, sehingga sudut pandangnya orang ketiga. Narator hanya menceritakan tindakan dan percakapan yang tampak, tidak menyelami pikiran semua tokoh, dan kedua tokoh dalam kutipan ini berperan sebagai tokoh pendukung, sehingga paling tepat orang ketiga pelaku sampingan. (Soal ini cukup debatable; disarankan dicocokkan dengan kunci resmi.)"},{"id":5,"orig":6,"ctx":"\u003cp class=\"ctx-t\">Kutipan novel berikut untuk soal nomor 5 s.d. 7. Bacalah dengan cermat!\u003c/p>\u003cp>(1) Haji Junaedi memperlihatkan surat yang masih dipegangnya itu kepada isterinya. (2) Nyai Salamah terkejut, ternganga mulutnya dan pucat warna mukanya. (3) “Engkau suka bermenantukan manteri itu?” tanya suaminya dengan tenang. (4) “Bermenantukan orang tua, yang berbini dan beranak itu? Daripada anakku bermadu, lebih baik tiada berlaki selama-lamanya. (5) Tidak, Akang, saya tidak mengharapkan pangkat, harta, hanya kesenangan anak saya. (6) Rupanya ia suka kepada siapa gerangan orang itu? Den Kosim, ya, benar! Bagaimana rundingan dengan Juragan Patih, Akang?” (7) “Belum ada keputusannya.” (8) “Lebih baik hal itu Akang segerakan, ulang rundingan dengan Juragan Patih. Katakan bahwa kita sudah siap.”\u003c/p>\u003cp class=\"ctx-src\">Katak Hendak Jadi Lembu, Nur Sutan Iskandar\u003c/p>","stem":"Watak Nyonya Salamah tidak materialistis terdapat dalam kalimat nomor ....","opts":["2","3","4","5","6"],"ans":3,"exp":"Kalimat (5) “saya tidak mengharapkan pangkat, harta, hanya kesenangan anak saya” menunjukkan ia tidak mengutamakan harta dan pangkat (tidak materialistis), melainkan kebahagiaan anaknya."},{"id":6,"orig":7,"ctx":"\u003cp class=\"ctx-t\">Kutipan novel berikut untuk soal nomor 5 s.d. 7. Bacalah dengan cermat!\u003c/p>\u003cp>(1) Haji Junaedi memperlihatkan surat yang masih dipegangnya itu kepada isterinya. (2) Nyai Salamah terkejut, ternganga mulutnya dan pucat warna mukanya. (3) “Engkau suka bermenantukan manteri itu?” tanya suaminya dengan tenang. (4) “Bermenantukan orang tua, yang berbini dan beranak itu? Daripada anakku bermadu, lebih baik tiada berlaki selama-lamanya. (5) Tidak, Akang, saya tidak mengharapkan pangkat, harta, hanya kesenangan anak saya. (6) Rupanya ia suka kepada siapa gerangan orang itu? Den Kosim, ya, benar! Bagaimana rundingan dengan Juragan Patih, Akang?” (7) “Belum ada keputusannya.” (8) “Lebih baik hal itu Akang segerakan, ulang rundingan dengan Juragan Patih. Katakan bahwa kita sudah siap.”\u003c/p>\u003cp class=\"ctx-src\">Katak Hendak Jadi Lembu, Nur Sutan Iskandar\u003c/p>","stem":"Pendeskripsian watak Nyonya Salamah diungkapkan melalui ....","opts":["secara langsung","dialog antartokoh","pikiran-pikiran tokoh","tanggapan tokoh lain","keadaan lingkungan tokoh"],"ans":1,"exp":"Watak Nyonya Salamah (menolak menantu yang sudah beristri, tidak mengejar harta, memikirkan kebahagiaan anak) terungkap melalui ucapannya dalam percakapan dengan Haji Junaedi, yaitu dialog antartokoh. Pengarang tidak menyebut wataknya secara langsung."},{"id":7,"orig":8,"ctx":"\u003cp class=\"ctx-t\">Bacalah teks dengan cermat!\u003c/p>\u003cp>Adalah sebuah negeri, dalam negeri itu ada sebuah kebun terlalu besarnya. Pada suatu pagi datanglah seorang pemburu serta membawa jaring dan panah. Berdirilah ia di tepi kolam itu, adalah kelakuannya seperti malaikat maut hendak mengambil nyawa. Demi dilihat sekalian gagak itu, sekaliannya pun berterbanglah. Tinggallah gagak yang bernama si Pandai Terbang bersembunyi hendak melihat bagaimana kelakuan pemburu itu. Pemburu itu merentangkan jaringnya dan membubuh umpannya berkeliling dan bersembunyilah ia. Seketika datanglah sekawanan burung tekukur dan rajanya. Sekalian tekukur itu singgahlah memakan umpan itu, sekaliannya itu pun terkenalah jaring. Demi dilihatlah oleh pemburu itu dan sukacitalah ia terlalu sangat dan berlari-lari hendak menangkap burung itu. Pada ketika itu raja dan tekukur menyuruh kepada segala rakyatnya untuk terbang membawa jaring itu, maka sekaliannya itu pun terbang ke udara membawa jaring itu.\u003c/p>","stem":"Isi kutipan/teks tersebut adalah ....","opts":["Tukang jaring burung tekukur menjaring burung dan jaringnya dibawa terbang oleh burung tersebut","Burung tekukur yang terjaring dan membawa jaring terbang bersama sekawanan burung","Sekawanan burung yang terjaring dan terbang membawa jaring yang melekat ditubuhnya","Seorang pemburu yang akan menjaring burung, tetapi tidak berhasil karena burungnya terbang","Seorang pemburu yang menjaring burung dan jaringnya dibawa terbang oleh sekawanan burung tekukur"],"ans":4,"exp":"Alur teks: pemburu memasang jaring dan umpan, sekawanan tekukur terkena jaring, lalu raja tekukur menyuruh rakyatnya terbang bersama-sama membawa jaring itu. Jadi isinya: seorang pemburu menjaring burung, tetapi jaringnya dibawa terbang oleh sekawanan burung tekukur."},{"id":8,"orig":9,"ctx":"\u003cp class=\"ctx-t\">Bacalah teks berikut untuk menjawab soal nomor 9 s.d. 11!\u003c/p>\u003cp>Adalah sebuah negeri, dalam negeri itu ada sebuah kebun terlalu besarnya. Pada suatu pagi datanglah seorang pemburu serta membawa jaring dan panah. Berdirilah ia di tepi kolam itu, adalah kelakuannya seperti malaikat maut hendak mengambil nyawa. Demi dilihat sekalian gagak itu, sekaliannya pun berterbanglah. Tinggallah gagak yang bernama si Pandai Terbang bersembunyi hendak melihat bagaimana kelakuan pemburu itu. Pemburu itu merentangkan jaringnya dan membubuh umpannya berkeliling dan bersembunyilah ia. Seketika datanglah sekawanan burung tekukur dan rajanya. Sekalian tekukur itu singgahlah memakan umpan itu, sekaliannya itu pun terkenalah jaring. Demi dilihatlah oleh pemburu itu dan sukacitalah ia terlalu sangat dan berlari-lari hendak menangkap burung itu. Pada ketika itu raja dan tekukur menyuruh kepada segala rakyatnya untuk terbang membawa jaring itu, maka sekaliannya itu pun terbang ke udara membawa jaring itu.\u003c/p>","stem":"Hal yang membuktikan teks tersebut merupakan hikayat adalah ....","opts":["bahasa yang digunakan sangat menarik, tetapi sulit dipahami","tema ceritanya mengenai petualangan seorang penghuni istana","ceritanya berisi kemustahilan dan terdapat tokoh binatang","latar ceritanya di hutan dan istana raja-raja (istana sentris)","tokoh ceritanya seekor burung dan raja yang adil bijaksana"],"ans":2,"exp":"Ciri hikayat pada teks: ceritanya mustahil (burung dapat berbicara, diperintah raja, dan terbang membawa jaring) dan tokohnya binatang (gagak, tekukur). Latar teks adalah kebun/kolam, bukan istana, sehingga opsi D tidak tepat."},{"id":9,"orig":10,"ctx":"\u003cp class=\"ctx-t\">Bacalah teks berikut untuk menjawab soal nomor 9 s.d. 11!\u003c/p>\u003cp>Adalah sebuah negeri, dalam negeri itu ada sebuah kebun terlalu besarnya. Pada suatu pagi datanglah seorang pemburu serta membawa jaring dan panah. Berdirilah ia di tepi kolam itu, adalah kelakuannya seperti malaikat maut hendak mengambil nyawa. Demi dilihat sekalian gagak itu, sekaliannya pun berterbanglah. Tinggallah gagak yang bernama si Pandai Terbang bersembunyi hendak melihat bagaimana kelakuan pemburu itu. Pemburu itu merentangkan jaringnya dan membubuh umpannya berkeliling dan bersembunyilah ia. Seketika datanglah sekawanan burung tekukur dan rajanya. Sekalian tekukur itu singgahlah memakan umpan itu, sekaliannya itu pun terkenalah jaring. Demi dilihatlah oleh pemburu itu dan sukacitalah ia terlalu sangat dan berlari-lari hendak menangkap burung itu. Pada ketika itu raja dan tekukur menyuruh kepada segala rakyatnya untuk terbang membawa jaring itu, maka sekaliannya itu pun terbang ke udara membawa jaring itu.\u003c/p>","stem":"Nilai moral yang terdapat dalam teks tersebut adalah ....","opts":["tidak memiliki rasa peduli akan nasib orang lain yang sedang menderita","perilaku raja terukur yang menyelamatkan rakyatnya dari bahaya","raja tekukur menipu rakyatnya untuk keselamatan dirinya","raja tekukur dan pemburu saling membantu dan memberi","pemburu yang lebih menyayangi burung gagak daripada tekukur"],"ans":1,"exp":"Raja tekukur memimpin rakyatnya terbang bersama-sama membawa jaring sehingga semuanya selamat dari pemburu. Nilai moralnya adalah sikap pemimpin yang bertanggung jawab dan persatuan dalam menghadapi bahaya."},{"id":10,"orig":12,"ctx":"\u003cp class=\"ctx-t\">Cermatilah kutipan tajuk berikut!\u003c/p>\u003cp>Sekolah-sekolah masih membutuhkan sumbangan agar bisa menyediakan sarana dan prasarana yang layak bagi murid-muridnya. Syukur-syukur tidak hanya sekadar layak, tetapi juga yang terbaik. Sumbangan tersebut bersifat tidak mengikat, baik jumlah maupun waktu. Jadi, harus dibedakan dari pungutan yang jelas-jelas telah dilarang. Sumber sumbangan itu bisa dari orang tua atau wali murid, bisa pula dari kalangan luar sekolah, misalnya swasta. Ada pula beberapa sekolah, khususnya swasta yang merintis kerja sama dengan yayasan atau sekolah di luar negeri. Langkah seperti itu dapat ditiru oleh sekolah negeri. Dengan demikian, kerja sama sekolah swasta dengan yayasan dapat ditiru oleh sekolah-sekolah negeri.\u003c/p>","stem":"Opini penulis yang sesuai dengan isi kutipan tajuk rencana tersebut adalah ....","opts":["Orang tua murid harus menyumbang sekolah untuk sarana dan prasarana","Sekolah dapat meminta sumbangan orang tua murid untuk sarana dan prasarana","Kalangan luar sekolah jelas-jelas dilarang dimintai sumbangan sekolah","Beberapa sekolah merintis kerja sama dengan yayasan atau sekolah luar negeri","Kerja sama sekolah swasta dengan yayasan dapat ditiru oleh sekolah negeri"],"ans":4,"exp":"Opini adalah pendapat/penilaian penulis, bukan fakta. Pernyataan “langkah seperti itu dapat ditiru oleh sekolah negeri” adalah saran/penilaian penulis. Opsi D adalah fakta (sudah ada sekolah yang merintis kerja sama), sedangkan opsi A, B, dan C tidak sesuai dengan isi tajuk (sumbangan bersifat tidak mengikat dan sumbernya boleh dari luar sekolah)."},{"id":11,"orig":13,"ctx":"\u003cp class=\"ctx-t\">Kutipan cerpen untuk soal nomor 13 dan 14\u003c/p>\u003cp>Seorang pengacara muda yang cemerlang mengunjungi ayahnya, seorang pengacara senior yang sangat dihormati oleh para penegak hukum.\u003c/p>\u003cp>“Tapi aku datang tidak sebagai putramu,” kata pengacara muda itu, “aku datang ke mari sebagai seorang pengacara muda yang ingin menegakkan keadilan negeri yang sedang kacau ini.”\u003c/p>\u003cp>Pengacara tua yang bercambang dan berjenggot memutih itu tidak terkejut. Ia menatap putranya dari kursi rodanya, lalu menjawab dengan suara yang tenang dan agung.\u003c/p>\u003cp>“Apa yang ingin kamu tentang, anak muda?”\u003c/p>\u003cp>Pengacara muda tertegun. “Ayahanda bertanya kepadaku?”\u003c/p>\u003cp>“Ya, kepada kamu, bukan sebagai putraku, tetapi kamu sebagai ujung tombak pencarian keadilan di negeri yang sedang dicabik-cabik korupsi ini.”\u003c/p>\u003cp class=\"ctx-src\">Putu Wijaya, Peradilan Rakyat\u003c/p>","stem":"Amanat yang tersirat dalam penggalan cerpen tersebut yang paling tepat adalah ....","opts":["Seorang anak harus menghormati orang tuanya dalam keadaan apa pun dan situasi apa pun","Seorang pengacara harus berani menegakkan keadilan untuk menyelamatkan negara","Seorang pengacara tua harus memberi contoh kepada pengacara muda sebagai pedoman atas tindakannya","Orang tua harus mewariskan apa-apa yang baik kepada anaknya sebagai keteladanan yang akan ditiru","Seorang ayah harus memberikan nasihat kepada putranya dengan sungguh-sungguh"],"ans":1,"exp":"Sang ayah menyebut anaknya sebagai “ujung tombak pencarian keadilan di negeri yang sedang dicabik-cabik korupsi”. Pesan (amanat) yang tersirat: seorang pengacara harus berani menegakkan keadilan demi menyelamatkan negara dari korupsi."},{"id":12,"orig":14,"ctx":"\u003cp class=\"ctx-t\">Kutipan cerpen untuk soal nomor 13 dan 14\u003c/p>\u003cp>Seorang pengacara muda yang cemerlang mengunjungi ayahnya, seorang pengacara senior yang sangat dihormati oleh para penegak hukum.\u003c/p>\u003cp>“Tapi aku datang tidak sebagai putramu,” kata pengacara muda itu, “aku datang ke mari sebagai seorang pengacara muda yang ingin menegakkan keadilan negeri yang sedang kacau ini.”\u003c/p>\u003cp>Pengacara tua yang bercambang dan berjenggot memutih itu tidak terkejut. Ia menatap putranya dari kursi rodanya, lalu menjawab dengan suara yang tenang dan agung.\u003c/p>\u003cp>“Apa yang ingin kamu tentang, anak muda?”\u003c/p>\u003cp>Pengacara muda tertegun. “Ayahanda bertanya kepadaku?”\u003c/p>\u003cp>“Ya, kepada kamu, bukan sebagai putraku, tetapi kamu sebagai ujung tombak pencarian keadilan di negeri yang sedang dicabik-cabik korupsi ini.”\u003c/p>\u003cp class=\"ctx-src\">Putu Wijaya, Peradilan Rakyat\u003c/p>","stem":"Nilai moral yang terungkap dalam penggalan cerpen tersebut adalah ....","opts":["seorang pengacara muda yang tidak menghormati ayahnya","seorang pengacara menegakkan keadilan dan kebenaran","sikap kukuh pengacara muda untuk menegakkan keadilan","sikap ayah yang tidak mengakui prestasi anaknya","sikap seorang anak pengacara muda yang tidak patuh"],"ans":2,"exp":"Nilai moral berkaitan dengan sikap tokoh. Pengacara muda datang dengan tekad teguh untuk menegakkan keadilan di negeri yang kacau, sehingga nilai moralnya adalah sikap kukuh untuk menegakkan keadilan. Opsi A, D, dan E bernilai negatif dan tidak sesuai isi. (Opsi B mirip, tetapi C lebih tepat menyebut sikap tokoh; disarankan dicocokkan dengan kunci resmi.)"},{"id":13,"orig":15,"ctx":"\u003cp class=\"ctx-t\">Bacalah dengan cermat!\u003c/p>\u003cp class=\"ctx-c\">\u003cb>NILAI UJIAN NASIONAL MATAPELAJARAN BAHASA INDONESIA\u003c/b>\u003c/p>\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Jenjang\u003c/th>\u003cth>Tahun 2006\u003c/th>\u003cth>Tahun 2007\u003c/th>\u003cth>Tahun 2008\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>SMP\u003c/td>\u003ctd>7,46\u003c/td>\u003ctd>7,39\u003c/td>\u003ctd>7,00\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>SMA Bahasa\u003c/td>\u003ctd>7,40\u003c/td>\u003ctd>7,08\u003c/td>\u003ctd>6,56\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>SMA IPA\u003c/td>\u003ctd>7,90\u003c/td>\u003ctd>7,56\u003c/td>\u003ctd>7,60\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>SMA IPS\u003c/td>\u003ctd>7,26\u003c/td>\u003ctd>6,95\u003c/td>\u003ctd>6,95\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","stem":"Pernyataan yang sesuai dengan data tabel tersebut adalah ....","opts":["Nilai SMP selalu lebih tinggi daripada nilai ujian SMA","Nilai SMA IPA pada tahun 2007 lebih tinggi dari tahun 2008","Nilai SMA IPA paling tinggi daripada jenjang lainnya","SMA jurusan Bahasa memiliki nilai di atas SMA jurusan IPA","SMA jurusan IPS memiliki nilai lebih tinggi daripada SMP"],"ans":2,"exp":"Periksa tiap opsi pada tabel. A salah: pada 2006 SMA IPA (7,90) lebih tinggi dari SMP (7,46). B salah: IPA 2007 = 7,56 lebih rendah dari 2008 = 7,60. C benar: IPA tertinggi pada ketiga tahun (7,90; 7,56; 7,60). D salah: Bahasa selalu di bawah IPA. E salah: IPS selalu di bawah SMP."},{"id":14,"orig":16,"ctx":"\u003cp class=\"ctx-t\">Bacalah dengan cermat!\u003c/p>\u003cp class=\"ctx-c\">\u003cb>NILAI UJIAN NASIONAL MATAPELAJARAN BAHASA INDONESIA\u003c/b>\u003c/p>\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Jenjang\u003c/th>\u003cth>Tahun 2006\u003c/th>\u003cth>Tahun 2007\u003c/th>\u003cth>Tahun 2008\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>SMP\u003c/td>\u003ctd>7,46\u003c/td>\u003ctd>7,39\u003c/td>\u003ctd>7,00\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>SMA Bahasa\u003c/td>\u003ctd>7,40\u003c/td>\u003ctd>7,08\u003c/td>\u003ctd>6,56\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>SMA IPA\u003c/td>\u003ctd>7,90\u003c/td>\u003ctd>7,56\u003c/td>\u003ctd>7,60\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>SMA IPS\u003c/td>\u003ctd>7,26\u003c/td>\u003ctd>6,95\u003c/td>\u003ctd>6,95\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","stem":"Simpulan isi tabel tersebut adalah ....","opts":["Setiap tahun, nilai ujian nasional jenjang SMP selalu mengalami fluktuasi (berubah-ubah)","Nilai ujian nasional Bahasa Indonesia di semua jenjang selalu mengalami penurunan","Nilai ujian nasional Bahasa Indonesia terbaik di semua jenjang terjadi tahun 2006","SMA akan meraih nilai ujian nasional Bahasa Indonesia lebih baik daripada SMP","Nilai ujian nasional SMP lebih tinggi daripada jenjang SMA IPA, IPS, dan Bahasa"],"ans":2,"exp":"Nilai tertinggi setiap jenjang ada pada tahun 2006 (SMP 7,46; Bahasa 7,40; IPA 7,90; IPS 7,26). A salah karena nilai SMP terus turun, bukan berubah-ubah. B salah karena IPA naik dari 7,56 ke 7,60 pada 2008. D dan E tidak didukung data."},{"id":15,"orig":17,"ctx":"\u003cp class=\"ctx-t\">Bacalah paragraf berikut untuk soal nomor 17 dan 18!\u003c/p>\u003cp>Setiap orang nyaris tidak mempunyai waktu istirahat di hari-hari kerjanya karena hampir semua aktivitas dikejar oleh tenggang waktu dan dituntut dengan hasil kerja yang cepat dan tepat. Di akhir pekan, mereka menghabiskan waktu untuk beristirahat, berekreasi, dan bersantap kuliner dengan keluarga atau teman. Sejumlah perilaku seperti mengonsumsi makanan siap saji, merokok, meminum minuman beralkohol, kerja berlebihan, kurang berolahraga, dan stres telah menjadi bagian hidup masyarakat. Maka tidak heran dalam pola makan pun banyak orang yang tidak teratur memenuhi kebutuhan gizinya karena makanan yang diasup tidak memenuhi standar gizi yang seimbang, melainkan kaya akan lemak jenuh tinggi. Gaya hidup masyarakat modern penuh dengan aktivitas padat yang dilengkapi kenyamanan serba ada, bersifat praktis, dan cepat, tetapi tidak memenuhi standar gizi.\u003c/p>","stem":"Istilah kuliner dalam paragraf tersebut bermakna ....","opts":["masakan daerah terkategori istimewa","berhubungan dengan masak-memasak","masakan sederhana olahan sendiri","masakan dengan ciri khas daerah","penyajian, rasa, dan bumbu masakan"],"ans":1,"exp":"Menurut KBBI, kuliner berarti berhubungan dengan masak-memasak. Dalam kalimat “bersantap kuliner”, kata ini menunjuk pada kegiatan yang berkaitan dengan makanan/masakan."},{"id":16,"orig":18,"ctx":"\u003cp class=\"ctx-t\">Bacalah paragraf berikut untuk soal nomor 17 dan 18!\u003c/p>\u003cp>Setiap orang nyaris tidak mempunyai waktu istirahat di hari-hari kerjanya karena hampir semua aktivitas dikejar oleh tenggang waktu dan dituntut dengan hasil kerja yang cepat dan tepat. Di akhir pekan, mereka menghabiskan waktu untuk beristirahat, berekreasi, dan bersantap kuliner dengan keluarga atau teman. Sejumlah perilaku seperti mengonsumsi makanan siap saji, merokok, meminum minuman beralkohol, kerja berlebihan, kurang berolahraga, dan stres telah menjadi bagian hidup masyarakat. Maka tidak heran dalam pola makan pun banyak orang yang tidak teratur memenuhi kebutuhan gizinya karena makanan yang diasup tidak memenuhi standar gizi yang seimbang, melainkan kaya akan lemak jenuh tinggi. Gaya hidup masyarakat modern penuh dengan aktivitas padat yang dilengkapi kenyamanan serba ada, bersifat praktis, dan cepat, tetapi tidak memenuhi standar gizi.\u003c/p>","stem":"Simpulan isi paragraf tersebut adalah ....","opts":["masyarakat modern yang padat aktivitas, memanfaatkan waktu luangnya untuk bersantap kuliner bersama keluarga atau teman.","gaya hidup masyarakat modern adalah mengonsumsi makanan siap saji, minum minuman beralkohol, merokok, kurang olahraga, kerja berlebihan, dan menderita stres cukup berat.","gaya hidup masyarakat modern yang padat aktivitas menyebabkan timbulnya perilaku mengonsumsi makanan yang tidak memenuhi standar gizi.","masyarakat modern adalah masyarakat di perkotaan yang hidup dengan berbagai aktivitas dan makan makanan siap saji tanpa mempertimbangkan gizi yang terkandung di dalamnya.","masyarakat modern tidak mempunyai cukup waktu untuk istirahat atau berkumpul bersama keluarga, kecuali pada akhir pekan yang digunakan untuk berekreasi."],"ans":2,"exp":"Paragraf menghubungkan aktivitas yang padat dengan pola makan yang tidak memenuhi standar gizi (hubungan sebab-akibat), dan ditegaskan pada kalimat terakhir. Opsi lain hanya merangkum sebagian detail atau menambah informasi yang tidak ada (misalnya “di perkotaan”)."},{"id":17,"orig":19,"ctx":"\u003cp class=\"ctx-t\">Cermatilah gurindam berikut!\u003c/p>\u003cp class=\"poem\">Jika kena penyakit kikir\u003cbr>Sanak saudara?\u003c/p>","stem":"Maksud isi gurindam tersebut adalah ....","opts":["Keluarga orang yang berpenyakit kikir akan dikucilkan oleh tetangganya","Orang yang berpenyakit kikir harus meninggalkan keluarganya","Orang yang bersifat kikir akan dijauhi oleh sanak saudara dan kerabatnya","Bila bertemu orang yang berpenyakit kikir segeralah lari menghindarinya","Jangan berteman dengan orang berketurunan sangat kikir"],"ans":2,"exp":"Gurindam terdiri atas dua larik: larik pertama berisi syarat (jika kena penyakit kikir) dan larik kedua berisi akibatnya, yaitu sanak saudara akan menjauh. Maksudnya: orang yang kikir dijauhi oleh sanak saudara dan kerabatnya."},{"id":18,"orig":20,"ctx":"\u003cp class=\"ctx-t\">Cermatilah teks berikut!\u003c/p>\u003cp>(1) Indonesia adalah penghasil utama minyak sawit mentah (CPO) dengan produksi 19,2 juta ton pada 2008. (2) CPO kini menguasai 27 persen pangsa pasar minyak nabati dunia, mengalahkan minyak kedelai dan kanola. (3) Harga CPO pun kini cukup menarik sehingga mendorong pengusaha terus berekspansi. (4) Diperkirakan 2,8 juta hektar lahan gambut masuk konsesi kelapa sawit. (5) Menurut Irsal, lahan dengan ketebalan gambut kurang dari tiga meter dapat ditanami kelapa sawit selama dikelola taat asas. (6) Pemerintah akan menerbitkan berbagai regulasi untuk itu.\u003c/p>","stem":"Apa yang mendorong pengusaha CPO terus berekspansi?","opts":["Produksi CPO pada tahun 2008 sangat tinggi mencapai 19,2 juta ton","Menanami lahan gambut dengan kelapa sawit secara terprogram","CPO menguasai pangsa pasar minyak nabati dunia dengan harga yang tinggi","Penanaman kelapa sawit pada lahan gambut dengan ketebalan tiga meter","Pemerintah sudah menerbitkan regulasi untuk penanaman lahan gambut"],"ans":2,"exp":"Kalimat (3) menyebut harga CPO yang menarik mendorong pengusaha berekspansi, didukung kalimat (2) bahwa CPO menguasai pangsa pasar minyak nabati dunia. Opsi E salah karena regulasi baru “akan” diterbitkan, bukan sudah."},{"id":19,"orig":22,"ctx":"\u003cp class=\"ctx-t\">Cermatilah teks berikut untuk soal nomor 22 s.d. 24!\u003c/p>\u003cp>(1) Aktivitas Gunung Slamet setinggi 3.432 meter di atas permukaan laut di perbatasan Kabupaten Banyumas dan Pemalang, Jawa Tengah, tambah meningkat setelah beberapa waktu lalu mereda. (2) Selain peningkatan jumlah gempa, juga terjadi letusan asap berwarna hitam kecoklatan dengan ketinggian mencapai 1.000 meter. (3) Letusan asap menimbulkan hujan abu di wilayah sekitar gunung. (4) Hal ini tidak berpengaruh terhadap tumbuhan dan hewan di kawasan Gunung Slamet. (5) Udara di sekitar kota Banyumas sejak seminggu terakhir terasa panas.\u003c/p>","stem":"Ide pokok paragraf tersebut adalah peningkatan ....","opts":["aktivitas Gunung Slamet","jumlah gempa","letusan gunung berapi","suhu udara pegunungan","wilayah hujan abu"],"ans":0,"exp":"Kalimat pertama menyatakan hal umum, yaitu aktivitas Gunung Slamet yang meningkat. Kalimat-kalimat berikutnya (gempa, letusan asap, hujan abu) menjelaskan peningkatan aktivitas tersebut."},{"id":20,"orig":23,"ctx":"\u003cp class=\"ctx-t\">Cermatilah teks berikut untuk soal nomor 22 s.d. 24!\u003c/p>\u003cp>(1) Aktivitas Gunung Slamet setinggi 3.432 meter di atas permukaan laut di perbatasan Kabupaten Banyumas dan Pemalang, Jawa Tengah, tambah meningkat setelah beberapa waktu lalu mereda. (2) Selain peningkatan jumlah gempa, juga terjadi letusan asap berwarna hitam kecoklatan dengan ketinggian mencapai 1.000 meter. (3) Letusan asap menimbulkan hujan abu di wilayah sekitar gunung. (4) Hal ini tidak berpengaruh terhadap tumbuhan dan hewan di kawasan Gunung Slamet. (5) Udara di sekitar kota Banyumas sejak seminggu terakhir terasa panas.\u003c/p>","stem":"Kalimat utama paragraf tersebut terdapat pada nomor ....","opts":["5","4","3","2","1"],"ans":4,"exp":"Kalimat utama memuat ide pokok dan bersifat umum. Kalimat (1) memuat ide pokok (aktivitas Gunung Slamet meningkat) dan paragraf tersebut berpola deduktif."},{"id":21,"orig":24,"ctx":"\u003cp class=\"ctx-t\">Cermatilah teks berikut untuk soal nomor 22 s.d. 24!\u003c/p>\u003cp>(1) Aktivitas Gunung Slamet setinggi 3.432 meter di atas permukaan laut di perbatasan Kabupaten Banyumas dan Pemalang, Jawa Tengah, tambah meningkat setelah beberapa waktu lalu mereda. (2) Selain peningkatan jumlah gempa, juga terjadi letusan asap berwarna hitam kecoklatan dengan ketinggian mencapai 1.000 meter. (3) Letusan asap menimbulkan hujan abu di wilayah sekitar gunung. (4) Hal ini tidak berpengaruh terhadap tumbuhan dan hewan di kawasan Gunung Slamet. (5) Udara di sekitar kota Banyumas sejak seminggu terakhir terasa panas.\u003c/p>","stem":"Kalimat penjelas yang tidak mendukung kalimat utama adalah ....","opts":["1","2","3","4","5"],"ans":4,"exp":"Kalimat (2), (3), dan (4) menjelaskan akibat/peristiwa dari meningkatnya aktivitas gunung. Kalimat (5) tentang udara panas di kota Banyumas tidak berhubungan langsung dengan aktivitas gunung sehingga tidak mendukung kalimat utama. (Kalimat 1 adalah kalimat utama, bukan kalimat penjelas.)"},{"id":22,"orig":25,"ctx":"\u003cp class=\"ctx-t\">Bacalah paragraf berikut ini!\u003c/p>\u003cp>Siapa yang tidak ingin bekerja? Orang tua membiayai anaknya sekolah sampai tingkat tinggi, bahkan kalau mampu, hingga bertitel profesor doktor. Tujuannya agar dapat bekerja dan mencari nafkah. Akan tetapi, jika si anak gagal, orang tua pasti marah dan kecewa. Bukankah orang tua rela membiayai pendidikan agar anaknya hidup bahagia?\u003c/p>","stem":"Hal yang diungkapkan dalam paragraf tersebut adalah ....","opts":["Para orang tua menyekolahkan anak mereka agar mudah mendapat pekerjaan","Orang tua pasti marah dan kecewa jika anaknya tidak masuk sekolah","Setiap orang tua pasti ingin anaknya bersekolah dan bertitel","Orang tua rela membiayai pendidikan anaknya semahal apapun","Salah satu upaya untuk mencapai kebahagiaan dengan bersekolah dan bekerja"],"ans":4,"exp":"Paragraf berpola: sekolah → bekerja → hidup bahagia. Kalimat penutup (pertanyaan retoris) menegaskan bahwa orang tua membiayai pendidikan agar anak bahagia. Jadi gagasan yang diungkapkan adalah bersekolah dan bekerja sebagai salah satu upaya mencapai kebahagiaan. (Soal ini cukup debatable; disarankan dicocokkan dengan kunci resmi.)"},{"id":23,"orig":26,"ctx":"\u003cp class=\"ctx-t\">Cermatilah paragraf berikut!\u003c/p>\u003cp>Jasa-jasa ekologi yang terdapat di Kawasan Ekosistem Leuser mencakup penyediaan air bersih, pengendalian erosi ... banjir, pengaturan iklim lokal, penyerapan karbon, perikanan air tawar, ... keindahan alam pendukung industri pariwisata. Jasa-jasa ini hanya dapat tersedia ... Kawasan Ekosistem Leuser dijaga dan dipelihara fungsinya sebagai suatu kesatuan interaksi yang utuh.\u003c/p>","stem":"Kata penghubung yang tepat untuk melengkapi bagian yang rumpang pada paragraf tersebut adalah ....","opts":["atau, tetapi, sebab","yaitu, bahkan, bahwa","serta, yakni, dan","dan, serta, jika","karena, misalnya, apabila"],"ans":3,"exp":"Rumpang 1: “pengendalian erosi dan banjir” (penggabungan setara) → dan. Rumpang 2: “…perikanan air tawar, serta keindahan alam…” (penutup rangkaian) → serta. Rumpang 3: “hanya dapat tersedia jika Kawasan… dijaga” (syarat) → jika."},{"id":24,"orig":27,"ctx":"\u003cp class=\"ctx-t\">Cermatilah paragraf narasi berikut!\u003c/p>\u003cp>Ombak yang bergulung lembut sore itu benar-benar menunjukkan pesona. Perahu dengan layar warna-warni menghias diorama nyata alam terbuka. Kilau rona kemuning bias sinar matahari sore. Sementara, wajah kecut wanita muda berpaling, bahwa pesona keindahan alam tak mau berpihak pada kisah asmaranya. Pemuda yang telah melukis kisah indah di hatinya ternyata tega berkhianat. Kesuciannya dirampas karena janji-janji kosong. Dia merenung ternyata keimanannya dikalahkan hanya dengan pujian memabukkan dan ... Rasanya tinggal kekecewaan yang sedang dilempar ke ufuk biar tenggelam tetapi mana mungkin.\u003c/p>","stem":"Ungkapan yang tepat untuk melengkapi bagian rumpang adalah ....","opts":["membuka hati","kebahagiaan hati","mulut manis","mulut berbisa","kelembutan hati"],"ans":2,"exp":"Konteksnya: sang pemuda berkhianat, menebar janji-janji kosong, dan menjerat dengan “pujian memabukkan dan ...”. Ungkapan yang selaras dengan rayuan kosong adalah mulut manis (pandai merayu). “Mulut berbisa” berarti kata-kata menyakitkan, tidak sesuai dengan “pujian”."},{"id":25,"orig":28,"ctx":"\u003cp class=\"ctx-t\">Cermatilah kalimat-kalimat berikut!\u003c/p>\u003cp>(1) Rasa pedas, misalnya, mempunyai khasiat dan kegunaan tersendiri.\u003c/p>\u003cp>(2) Lima macam cita rasa tanaman obat, yaitu pedas, manis, asam, pahit, dan asin.\u003c/p>\u003cp>(3) Rasa pahit untuk menghilangkan panas dan lembab, serta rasa asin sifatnya melunakkan dan sebagai pencahar.\u003c/p>\u003cp>(4) Cita rasa digunakan untuk tujuan tertentu.\u003c/p>\u003cp>(5) Rasa manis sifatnya menguatkan (tonik) dan menyejukkan.\u003c/p>\u003cp>(6) Rasa asam bersifat pengelat dan mengawetkan.\u003c/p>","stem":"Urutan kalimat yang tepat agar menjadi paragraf adalah ....","opts":["(1), (2), (4), (5), (6), dan (3)","(2), (1), (5), (6), (3), dan (4)","(2), (4), (6), (3), (5), dan (1)","(2), (4), (1), (5), (6), dan (3)","(4), (1), (2), (5), (6), dan (3)"],"ans":3,"exp":"Urutan logis: (2) menyebut lima cita rasa → (4) cita rasa digunakan untuk tujuan tertentu → (1) pedas (rasa pertama yang disebut, diawali “misalnya”) → (5) manis → (6) asam → (3) pahit dan asin. Urutan rasa mengikuti kalimat (2): pedas, manis, asam, pahit, asin."},{"id":26,"orig":29,"ctx":"\u003cp class=\"ctx-t\">Cermatilah kutipan pidato berikut!\u003c/p>\u003cp>Sudah banyak kasus tentang makanan berkemasan yang membahayakan kesehatan konsumen, baik produk impor maupun produk lokal. Kasus terbanyak yaitu makanan berkemasan yang sudah kedaluwarsa. Kasus terbaru lagi, yaitu adanya dendeng daging yang disinyalir daging babi hutan, tentunya ini tidak halal bagi umat Islam ...\u003c/p>","stem":"Kalimat penutup yang tepat berupa imbauan untuk teks tersebut adalah ....","opts":["Saya mengimbau Saudara-saudara agar mewaspadai makanan yang kadaluarsa yang dikemas menarik","Imbauan saya, berhati-hatilah makan makanan yang berkemasan berlabel halal","Saya imbau, janganlah makan-makanan yang berkemasan dalam merek apa pun karena berbahaya","Untuk itu, berhati-hatilah dalam memilih makanan yang dijual, baik di warung maupun di toko","Untuk itu, Saudara-saudara, haruslah teliti jika membeli makanan yang berkemasan agar terhindar dari bahaya"],"ans":4,"exp":"Penutup pidato berupa imbauan harus menyimpulkan isi teks (bahaya makanan berkemasan), menyapa pendengar (Saudara-saudara), dan memuat ajakan. Opsi E memenuhi semuanya. Opsi lain terlalu sempit (hanya kedaluwarsa/halal), terlalu umum (D), atau berlebihan (C: semua merek berbahaya)."},{"id":27,"orig":30,"ctx":"\u003cp class=\"ctx-t\">Cermatilah tema karya tulis berikut!\u003c/p>\u003cp>Tema karya tulis: Upaya pemerintah dalam pencegahan penebangan hutan.\u003c/p>","stem":"Kalimat latar belakang yang tepat untuk tema tersebut, yaitu ....","opts":["Hutan tropis banyak terdapat di Indonesia yang belum dimanfaatkan","Hutan sebagai pencegah pemanasan global yang sangat diharapkan di Indonesia","Luas hutan di Indonesia saat ini menyusut tajam akibat ulah manusia","Hutan sebagai sumber devisa negara yang dimiliki Indonesia","Hutan sebagai sumber air bersih untuk digunakan penduduknya"],"ans":2,"exp":"Latar belakang menjelaskan masalah yang mendorong penelitian/tulisan. Karena temanya pencegahan penebangan hutan, latar belakang yang paling relevan adalah kenyataan bahwa luas hutan menyusut tajam akibat ulah manusia (penebangan)."},{"id":28,"orig":31,"ctx":"\u003cp class=\"ctx-t\">Cermatilah paragraf berikut!\u003c/p>\u003cp>Mereka terkejut melihat harimau ... melepaskan Pak Balam dari cengkeramannya. Harimau itu menghilang ke dalam hutan yang sangat gelap tengah malam itu. Dengan cepat mereka berlari dan menuju ke tempat Pak Balam terbaring. Dalam cahaya samar-samar dari potongan kayu yang menyala, mereka melihat betapa kaki kiri Pak Balam lukanya ... betisnya kena gigitan harimau, daging dan otot betis koyak hingga kelihatan tulangnya yang putih dan darah mengalir ...\u003c/p>","stem":"Frasa berikut yang tepat untuk melengkapi paragraf tersebut adalah ....","opts":["sangat besar, besar benar, teramat banyak","sangat besar, amat parah, amat banyak","cukup besar, sakit sekali, bagaikan air","agak besar, dalam sekali, tak tertahankan","tinggi besar, paling lebar, seperti air"],"ans":1,"exp":"Urutan frasa: harimau yang “sangat besar”, luka yang “amat parah” (daging dan otot koyak sampai tulang terlihat), dan darah yang mengalir “amat banyak”. Frasa pada opsi lain tidak sesuai dengan tingkat keparahan kejadian."},{"id":29,"orig":33,"ctx":"\u003cp class=\"ctx-t\">Cermatilah penulisan judul karangan berikut!\u003c/p>\u003cp>Analisis karangan siswa sd kelas V di kecamatan Tanureja dalam menggunakan kata penghubung dan kata depan di kecamatan tanureja.\u003c/p>","stem":"Penulisan judul karangan ilmiah tersebut yang tepat sesuai dengan EYD adalah ....","opts":["Analisis Karangan Siswa SD Kelas V di Kecamatan Tanureja dalam Menggunakan Kata Penghubung dan Kata Depan","Analisis Karangan Siswa S.D. Kelas V di Kecamatan Tanureja Dalam Menggunakan Kata Penghubung dan Kata Depan","Analisis karangan siswa SD Kelas 5 di Kecamatan Tanureja Dalam Menggunakan Kata Penghubung dan Kata Depan","Analisis karangan Siswa SD Kelas V di kecamatan Tanureja dalam Menggunakan Kata Penghubung dan Kata Depan","Analisis Karangan Siswa SD Kelas V DI kecamatan Tanureja Dalam Menggunakan Kata Penghubung dan Kata Depan"],"ans":0,"exp":"Aturan EYD untuk judul: huruf awal setiap kata ditulis kapital kecuali kata tugas (di, dalam, dan, yang, dari, untuk) yang tidak di awal judul; singkatan SD ditulis tanpa titik; nama tempat (Kecamatan Tanureja) berhuruf kapital. Hanya opsi A yang memenuhi semuanya."},{"id":30,"orig":34,"ctx":"\u003cp class=\"ctx-c\">DICARI\u003c/p>\u003cp>Sebuah perusahaan industri membutuhkan seorang operator mesin. Syarat:\u003c/p>\u003cp>- lulusan STM jurusan mesin\u003c/p>\u003cp>- pengalaman min. 2 tahun\u003c/p>\u003cp>- laki-laki maksimal 20 tahun\u003c/p>\u003cp class=\"ctx-src\">(Kompas, 20 Maret 2010)\u003c/p>","stem":"Kalimat yang tepat pembuka surat lamaran pekerjaan sesuai iklan tersebut adalah ....","opts":["Sehubungan dengan iklan yang dimuat Kompas, tanggal 20 Maret 2010, saya mengajukan surat lamaran untuk bekerja di perusahaan Bapak","Sesuai dengan iklan di Kompas tanggal 20 Maret 2010 saya ingin mengajukan lamaran untuk bekerja di perusahaan Bapak","Dengan iklan yang dimuat Kompas, 20 Maret 2010, saya bermaksud mengajukan lamaran untuk bekerja di perusahaan Bapak sebagai yang dimaksud","Berhubung iklan yang dimuat Kompas, 20 Maret 2010, tentang lowongan pekerjaan. Saya berminat untuk mengisi lowongan tersebut","Berdasarkan iklan yang dimuat di Kompas 20 Maret 2010, saya mengajukan surat lamaran pekerjaan di perusahaan Bapak untuk mengisi lowongan tersebut"],"ans":0,"exp":"Kalimat pembuka surat lamaran yang baik memakai frasa pembuka baku (“Sehubungan dengan iklan yang dimuat…”), menyebut sumber dan tanggal iklan, lalu menyatakan maksud melamar. Opsi A paling efektif dan baku. Opsi B memakai “ingin” (kurang formal), C tidak jelas (“dengan iklan”, “sebagai yang dimaksud”), D berupa kalimat tidak lengkap, E boros (“surat lamaran pekerjaan … untuk mengisi lowongan”)."},{"id":31,"orig":35,"ctx":"\u003cp>Premis umum: Siswa yang baik selalu belajar dengan teratur\u003c/p>\u003cp>Premis khusus: Mely siswa yang baik\u003c/p>\u003cp>Simpulan: ....\u003c/p>","stem":"Kalimat simpulan yang tepat untuk melengkapi silogisme tersebut adalah ....","opts":["Karena itu Mely naik kelas karena belajar dengan teratur","Mely adalah siswa yang selalu belajar","Jadi, Mely selalu belajar dengan teratur","Berarti cara belajar Mely sudah benar","Mely siswa yang baik karena selalu belajar dengan teratur"],"ans":2,"exp":"Silogisme: semua siswa baik selalu belajar dengan teratur (premis umum); Mely siswa baik (premis khusus); maka Mely selalu belajar dengan teratur (simpulan). Opsi lain menambahkan informasi di luar premis (naik kelas, cara belajar benar) atau mengulang premis khusus (E)."},{"id":32,"orig":36,"ctx":"\u003cp class=\"ctx-t poem-t\">DERAI-DERAI CEMARA\u003c/p>\u003cp class=\"ctx-a\">Chairil Anwar\u003c/p>\u003cp class=\"poem\">cemara menderai sampai jauh\u003cbr>terasa hari akan jadi malam\u003cbr>ada beberapa dahan di tingkap merapuh\u003cbr>....................................\u003c/p>\u003cp class=\"poem\">aku sekarang orangnya bisa tahan\u003cbr>sudah berapa waktu bukan kanak lagi\u003cbr>tapi dulu memang ada suatu bahan\u003cbr>yang bukan dasar perhitungan kini\u003c/p>\u003cp class=\"poem\">hidup hanya menunda kekalahan\u003cbr>tambah terasing dari cinta sekolah rendah\u003cbr>dan tahu, ada yang tetap tidak terucapkan\u003cbr>sebelum pada akhirnya kita menyerah\u003c/p>","stem":"Larik bermajas yang tepat untuk melengkapi puisi tersebut adalah ....","opts":["dipukul angin yang terpendam","aku sedih ditinggal pergi","ditampar dengan tangan kanan","kakinya terjepit, sakit sekali","aku teringat masa laluku"],"ans":0,"exp":"Larik yang rumpang harus bermajas dan selaras dengan bait pertama (dahan merapuh di tingkap). “Dipukul angin yang terpendam” bermajas (personifikasi/metafora: angin memukul, perasaan yang terpendam) dan sejalan dengan suasana puisi. Opsi lain bermakna lugas (denotatif), bukan majas."},{"id":33,"orig":37,"ctx":"\u003cp class=\"ctx-t\">Bacalah dialog drama berikut!\u003c/p>\u003cp>Aleks: (masuk menjatuhkan buku-bukunya di meja dan duduk dengan kesal) Bing. Bing. (Berhenti) Bing. Bing. (Berhenti) Bong. Bong. (Berhenti) Bong. Bo-ooooong. Huh, Bongkrek.\u003c/p>\u003cp>Irna: He, sudah lama?\u003c/p>\u003cp>Aleks: ...\u003c/p>\u003cp>Irna: Lebih baru dari kau. Mana Bing?\u003c/p>\u003cp>Aleks: Tahu. Keluar kali.\u003c/p>\u003cp>Irna: Jadi, nggak jadi?\u003c/p>\u003cp>Aleks: Sejauh info samar-samar tafsiran masih bebas, kau boleh bilang jadi, boleh bilang tidak jadi. Boleh bilang ditunda, boleh bilang dimulai, tetapi terlambat, dan apa saja.\u003c/p>\u003cp class=\"ctx-src\">Diam, disadur oleh Bakdi Soemanto\u003c/p>","stem":"Kalimat yang sesuai untuk melengkapi teks drama tersebut adalah ....","opts":["Sudah dari tadi","Menunggumu","Bing sedang pergi","Baru saja. Kau?","Kamu dari mana"],"ans":3,"exp":"Irna bertanya “sudah lama?” lalu dijawab Aleks (rumpang), kemudian Irna berkata “Lebih baru dari kau.” Berarti jawaban Aleks menyatakan ia baru datang dan membalik pertanyaan kepada Irna: “Baru saja. Kau?”."},{"id":34,"orig":38,"ctx":"\u003cp class=\"ctx-t\">Kutipan cerpen\u003c/p>\u003cp>Begitulah, maka aku pun pernah jadi buah harap mereka. Buah cakap yang manis didengar dari gadis dan ibu-ibu di kampung. Tiap kali kalau kebetulan aku lewat di muka rumah mereka dari celah-celah kerai menjeling beberapa mata jelita dan tak jarang aku dapat gangguan ibu-ibu yang suka menyindir. Tapi, aku yang masih terlalu muda, tak mungkin sanggup memikirkan hal-hal yang sulit itu. Lagi pula ayahku (pentolan Serikat Islamnya Tjokroaminoto yang tergolong progresif) tak suka pada riil macam itu.\u003c/p>\u003cp class=\"ctx-src\">Jadi Santri, Djamil Suherman\u003c/p>","stem":"Kalimat kritik yang sesuai dengan kutipan cerpen tersebut adalah ....","opts":["Cerpen sulit dipahami karena bahasanya berbelit-belit dan mementingkan keindahan","Penyajian konflik dalam cerita dilakukan secara tersirat, yaitu melalui pikiran-pikiran tokoh","Cerpen itu kurang menarik karena menggunakan “akuan” yang jarang ditemukan dalam cerita lain","Cerpen tersebut sulit dipahami karena memakai kata progresif dan banyak kata asing lainnya","Latar yang tidak jelas membuat cerpen tersebut tidak menarik si pembaca dan tidak bermakna"],"ans":1,"exp":"Dalam kutipan, tokoh “aku” menceritakan pengalaman dan pikirannya (menjadi buah harap gadis dan ibu-ibu, merasa masih terlalu muda), tanpa konflik terbuka. Jadi konflik disajikan tersirat melalui pikiran tokoh. Opsi A, C, D, dan E tidak sesuai: bahasanya tidak berbelit, sudut pandang “aku” lazim dipakai, kata asing hanya sedikit, dan latar (kampung) cukup jelas."},{"id":35,"orig":39,"ctx":"\u003cp>Cermatilah identitas pelamar berikut!\u003c/p>\u003cp>Pelamar bernama Aditya\u003c/p>\u003cp>Lahir di Jakarta, 2 Juni 1991\u003c/p>\u003cp>Bertempat tinggal di Jalan Pramuka II/4, Jakarta Pusat\u003c/p>\u003cp>Latar belakang pendidikan SMA\u003c/p>","stem":"Penulisan yang tepat pemberian identitas pelamar tersebut adalah ....","opts":["Nama: Aditya\u003cbr>Tempat, tanggal lahir: Jakarta, 2 Juni 1991\u003cbr>Alamat: Jalan Pramuka II/4, Jakarta Pusat\u003cbr>Pendidikan: SMA","Nama: Aditya\u003cbr>Tempat/tanggal lahir: Jakarta, 2 Juni 1991\u003cbr>Alamat: Jln. Pramuka II/4, Jakarta Pusat\u003cbr>Pendidikan: SMA","Nama: Aditya\u003cbr>tempat tanggal lahir: Jakarta, 2 Juni 1991\u003cbr>alamat: Jalan Pramuka II/4, Jakarta Pusat\u003cbr>pendidikan: SMA","nama: Aditnya\u003cbr>tempat, tanggal lahir: Jakarta, 2 Juni 1991\u003cbr>alamat: Jalan Pramuka II/4, Jakarta Pusat\u003cbr>pendidikan: SMA","nama: Aditya\u003cbr>tempat/tanggal lahir: Jakarta, 2 Juni 1991\u003cbr>alamat: Jln. Pramuka II/4, Jakarta Pusat\u003cbr>pendidikan: STM"],"ans":0,"exp":"Penulisan identitas yang tepat: setiap judul data diawali huruf kapital dan diikuti titik dua, “Tempat, tanggal lahir” memakai koma, “Jalan” tidak disingkat, dan isi sesuai data (nama Aditya, pendidikan SMA). Opsi B memakai garis miring dan singkatan Jln., C dan D memakai huruf kecil (D juga salah nama), E salah data (STM)."},{"id":36,"orig":40,"ctx":"\u003cp class=\"ctx-t\">Cermatilah kalimat penutup surat lamaran pekerjaan berikut!\u003c/p>\u003cp>Besar harapan saya dapat diterima bekerja di perusahaan Bapak. Atas perhatiannya saya menghaturkan banyak terima kasih. [kalimat bercetak miring: “Atas perhatiannya saya menghaturkan banyak terima kasih.”]\u003c/p>","stem":"Perbaikan kalimat yang tercetak miring tersebut adalah ....","opts":["Atas perhatiannya, saya mengucapkan terima kasih","Atas perhatian Bapak saya ucapkan terima kasih","Atas perhatian Bapak, saya menyampaikan terima kasih","Atas perhatian Bapak, saya menyampaikan terima kasih","Atas perhatian Bapak. Saya mengucapkan terima kasih"],"ans":1,"exp":"Kalimat asli bermasalah karena “perhatiannya” tidak jelas merujuk siapa dan “menghaturkan” berlebihan/tidak lazim dalam surat resmi. Perbaikan yang tepat menyebut subjek yang dituju (Bapak) dan memakai bentuk baku “saya ucapkan terima kasih”. (Keyakinan jawaban ini sedang; sebaiknya dicocokkan dengan kunci resmi.)"},{"id":37,"orig":41,"ctx":"\u003cp class=\"ctx-t\">Cermatilah penjelasan karya sastra berikut ini!\u003c/p>\u003cp>Isi buku: Menceritakan gerakan mahasiswa pada suatu masa yang ingin merobohkan kekuasaan seorang pemimpin otoriter. Namun, ketika usaha itu berhasil, tidak serta-merta membawa perbaikan untuk seluruh lapisan kehidupan masyarakat. Anak didik Jenderal Suprawiro, sang pemimpin otoriter, muncul berebut kekuasaan kendati harus menghancurkan kehormatan mereka sendiri. Ketika kekuasaan beralih ke tangan Jenderal Yogaswara, para aktivis mahasiswa ditangkapi, termasuk Surianata, tokoh utama cerita ini.\u003c/p>\u003cp class=\"ctx-src\">Bulan Jingga dalam Kepala, Fadjroel Rahman\u003c/p>","stem":"Kalimat resensi yang menyatakan kelemahan buku sesuai dengan penjelasan tersebut adalah ....","opts":["Novel ini adalah semacam saripati perjalanan hidup pengarangnya karena bernuansa kenang-kenangan","Kerangka waktu pada novel ini membingungkan pembaca karena tidak menyebutkan tahun secara pasti","Para tokoh dalam novel ini mengalami pengembaraan fisik dan batin yang mencerminkan keluasan wawasan pengarangnya","Fadjroel telah membantu para pembaca novelnya untuk ikut merenung dan berupaya meraih idealisasi pengendali akal budi dan nurani","Pembaca akan memetik banyak pelajaran tentang kemanusiaan lewat tokoh-tokoh dalam novel"],"ans":1,"exp":"Soal meminta kalimat kelemahan buku. Opsi A, C, D, dan E semuanya bernada pujian/kelebihan (atau tidak terkait ringkasan). Hanya opsi B yang menyatakan kekurangan, yaitu kerangka waktu yang membingungkan karena tahun tidak disebut pasti; ringkasan memang hanya menyebut masa pemerintahan jenderal tanpa tahun."},{"id":38,"orig":42,"ctx":"\u003cp class=\"ctx-t\">Cermatilah paragraf berikut!\u003c/p>\u003cp>Kehidupan di dunia ini ibarat panggung sandiwara. Masing-masing manusia mempunyai peran sesuai dengan nasibnya yang diberikan Tuhan. Demikian juga pemain dalam sandiwara, semua pemain memiliki peran masing-masing sesuai dengan peran yang diberikan sutradara. Setiap manusia harus menjalankan perannya sesuai dengan ajaran yang dianutnya. Begitu pula bermain sandiwara harus berperan sesuai dengan tuntutan agar pertunjukannya sukses.\u003c/p>\u003cp>....\u003c/p>","stem":"Kalimat simpulan yang tepat untuk melengkapi paragraf analogi tersebut adalah ....","opts":["Dengan demikian, manusia yang hidupnya menjalankan perintah Tuhan dengan baik, akan mendapatkan pahala yang luar biasa","Karena itu, untuk menjadi seorang pemain sandiwara yang baik harus menghayati peran yang diinginkan sutradara dalam skenario","Oleh karena itu, kita sebagai manusia harus berbuat baik seperti kita mengikuti tuntutan skenario dalam bermain sandiwara","Jadi, bermain sandiwara itu harus mengikuti karakter yang dituntut oleh sutradara seperti halnya kehidupan manusia mengikuti ketentuan yang berlaku","Jadi, kita harus melaksanakan semua perintah Tuhan agar kita selamat di dunia maupun akhirat, seperti suksesnya pemain bila mengikuti petunjuk sutradara"],"ans":4,"exp":"Paragraf analogi membandingkan dua hal: manusia menjalankan peran dari Tuhan dan pemain menjalankan peran dari sutradara. Simpulan yang tepat harus memuat kedua pihak yang dibandingkan beserta hasilnya, sebagaimana opsi E. Opsi lain hanya memuat salah satu pihak atau mengandung janji/anjuran yang tidak dibahas."},{"id":39,"orig":43,"ctx":"\u003cp class=\"ctx-t\">Cermatilah paragraf berikut!\u003c/p>\u003cp>Eceng gondok termasuk gulma atau tumbuhan pengganggu. Eceng gondok menyebar dengan cepat lewat angin dan arus bawah air. Eceng gondok mampu mempercepat penguapan air tenang seperti danau atau sungai yang aliran airnya menggenang. Perairan yang ditumbuhi eceng gondok akan menjadi cepat dangkal. Kotoran dan lumpur yang melekat pada akar-akar tumbuhan tersebut akan mengganggu lalu lintas air ...\u003c/p>","stem":"Kalimat simpulan yang tepat untuk melengkapi paragraf deduktif tersebut adalah ....","opts":["Perairan yang ditumbuhi eceng gondok airnya kotor dan mudah mengalami pendangkalan","Sungai yang ditumbuhi eceng gondok airnya cepat menguap dan eceng gondok akan tumbuh subur","Eceng gondok akan mengganggu aliran air yang ada di sungai atau danau tersebut","Tumbuhan eceng gondok akan mengganggu kualitas air yang terdapat di sungai atau danau tersebut","Jadi, eceng gondok hanya bisa tumbuh di tempat yang airnya menggenang seperti di danau"],"ans":2,"exp":"Pada paragraf deduktif, ide pokok di awal (eceng gondok adalah tumbuhan pengganggu) diulang pada akhir paragraf sebagai penegasan. Kalimat penutup yang tepat menyimpulkan bahwa eceng gondok mengganggu aliran air di sungai atau danau, sejalan dengan kalimat-kalimat penjelas (penguapan, pendangkalan, lalu lintas air terganggu)."},{"id":40,"orig":44,"ctx":"\u003cp class=\"ctx-t\">Cermatilah paragraf berikut!\u003c/p>\u003cp>Banjir bandang adalah banjir yang terjadi secara tiba-tiba di permukaan rendah yang disebabkan hujan yang terus-menerus. Banjir bandang terjadi saat penjenuhan air terhadap tanah di wilayah tersebut berlangsung dengan sangat cepat hingga tidak dapat diserap lagi. Air yang tergenang lalu berkumpul di daerah-daerah dengan permukaan rendah dan mengalir dengan cepat ke daerah yang lebih rendah ....\u003c/p>","stem":"Kalimat yang berupa akibat untuk melengkapi paragraf tersebut adalah ....","opts":["Maka, banjir dapat terjadi karena peluapan air yang berlebihan di suatu tempat","Dengan demikian, jumlah curah hujan melebihi kemampuan serapan","Akhirnya, banjir secara tiba-tiba yang diakibatkan terisinya saluran air","Jadi, hujan besar dan peluapan air sungai, atau perlu kita waspadai setiap saat","Akhirnya terjadilah banjir yang tidak dapat diatasi di wilayah tersebut"],"ans":4,"exp":"Paragraf menjelaskan proses (hujan terus-menerus, tanah jenuh, air berkumpul dan mengalir cepat). Akibat dari rangkaian itu adalah terjadinya banjir yang tidak dapat diatasi, sebagaimana opsi E diawali kata penanda akibat “akhirnya”. Opsi B dan A menyatakan sebab, bukan akibat."},{"id":41,"orig":45,"ctx":"\u003cp class=\"ctx-t\">Cermatilah paragraf berikut!\u003c/p>\u003cp>Sebagai pasukan antiteroris, anggauta Gegana harus memiliki berbagai kemampuan. Oleh karena itu, pada saat penerimaan dilakukan berbagai seleksi. Mereka harus menjalani tes husus, seperti tes intelektual, psikotes, dan tes kesehatan. Hal itu akan mengurangi resiko kecelakaan pada saat bekerja. [kata bercetak miring: anggauta, husus, resiko]\u003c/p>","stem":"Penulisan kata baku yang tepat sesuai EYD untuk perbaikan kata yang bercetak miring dalam paragraf tersebut adalah ....","opts":["anggauta, khusus, resiko","anggota, khusus, risiko","angota, khusus, resiko","anggauta, khusus, resiko","anggota, husus, risiko"],"ans":1,"exp":"Bentuk baku: anggota (bukan anggauta/angota), khusus (bukan husus), dan risiko (bukan resiko)."},{"id":42,"orig":46,"ctx":"\u003cp class=\"ctx-t\">Cermatilah paragraf narasi berikut ini!\u003c/p>\u003cp>Kami memasuki pelataran kebun yang indah dan luas yang telah ditata oleh penata kebun terkenal dari Italia. Sebuah air mancur yang terletak di belakang ruangan dan berada di tengah kolam berbentuk bundar dihiasi dengan beraneka macam ikan yang eksotis. [Dengan hati riang kutempelkan kakiku di tepi kolam.] Daun-daun hijau segar menghiasi perlengkapan-perlengkapan rotan di tepi kolam yang dilengkapi dengan bantal-bantal berwarna pastel. (Kalimat tidak padu: yang berada dalam tanda kurung siku.)\u003c/p>","stem":"Kalimat yang tepat untuk memperbaiki kalimat yang tidak padu tercetak miring tersebut adalah ....","opts":["Tembok ruangan itu dibuat khusus dari kaca dengan ornamen yang indah","Potongan-potongan batu menempel mengitari tepi kolam","Bunga-bunga indah dirawat dengan apik oleh petugas khusus","Tempat itu merupakan tempat favorit kami menikmati senja","Tumbuhan hijau dan rimbun meneduhi kami dari terik matahari"],"ans":4,"exp":"Kalimat yang diganti harus padu dengan kalimat sekitarnya: menggunakan sudut pandang “kami”, dan masih menggambarkan suasana pelataran kebun di sekitar kolam. Kalimat E memenuhi keduanya (kami, tumbuhan hijau, suasana kolam yang teduh). Opsi lain menyimpang ke hal yang tidak berhubungan (tembok kaca, batu, petugas) atau memakai “tempat favorit” yang tidak sesuai alur. (Soal ini cukup debatable; disarankan dicocokkan dengan kunci resmi.)"},{"id":43,"orig":47,"ctx":"\u003cp class=\"ctx-t\">Cermatilah kalimat berikut!\u003c/p>\u003cp>Untuk merubah kegemaran para sesepuh penabuh gamelan memainkan musik tradisionil ke alat musik modern ternyata tidak semudah yang dibayangkan. Kecintaan mereka terhadap alat musik tersebut menjadi profesi dan sekaligus memerlukan ketrampilan tersendiri. [kata bercetak miring: merubah, tradisionil, ketrampilan]\u003c/p>","stem":"Kata baku sebagai pengganti kata yang tercetak miring tersebut adalah ....","opts":["meubah, tradisional, keterampilan","mengrubah, tradisionil, keterampilan","merubah, tradisi, ketrampilan","merobah, tradisional, ketrampilan","mengubah, tradisional, keterampilan"],"ans":4,"exp":"Bentuk baku: mengubah (dari kata dasar ubah, bukan merubah), tradisional (bukan tradisionil), dan keterampilan (dari terampil, bukan ketrampilan)."},{"id":44,"orig":48,"ctx":"\u003cp class=\"ctx-t\">Cermatilah paragraf berikut!\u003c/p>\u003cp>Pesatnya perkembangan iptek telah menggugah keingintahuan masyarakat terhadap sains. Untuk itu, tidaklah mengherankan jika media massa terus memenuhi kebutuhan pembacanya akan sajian-sajian iptek dengan intensitas dan visi yang berbeda-beda. Setiap media akan ... tulisan-tulisan iptek sesuai selera pembacanya. Namun, dalam fungsinya sebagai media massa, tentulah tulisan-tulisan tersebut ... dengan bahasa dan gaya populer penulisan.\u003c/p>","stem":"Kata berimbuhan yang tepat untuk melengkapi paragraf rumpang tersebut adalah ....","opts":["dicoba, mensajikan, mentampilkan","menyoba, menyaii, menampilkan","mencoba, menyaiikan, menampilkan","mencoba, menyajikan, ditampilkan","mencobakan, disajikan, ditampilkan"],"ans":3,"exp":"Rumpang 1 berkalimat aktif dengan subjek “setiap media”, sehingga mencoba menyajikan (aktif); rumpang 2 berkalimat pasif dengan subjek “tulisan-tulisan tersebut”, sehingga ditampilkan (pasif). Bentuk baku: mencoba, menyajikan (dasar sajikan, bukan mensajikan/menyaii), ditampilkan."}];
const TOTAL = Q.length;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const LET = ['A','B','C','D','E'];
const S = { screen:'start', idx:0, ans:{}, doubt:{}, user:{nama:'',kelas:'',peserta:'',sekolah:'',menit:'90'}, endAt:0, startedAt:0, finishedAt:0, auto:false, filter:'all', confirm:false };
let tick = null;

function pad(n){ return String(n).padStart(2,'0'); }
function fmt(ms){ const t=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':':'')+pad(m)+':'+pad(s); }
function status(i){ return S.doubt[i] ? 'dbt' : (S.ans[i]!==undefined ? 'ans' : 'un'); }
function counts(){
  let a=0,d=0,u=0;
  Q.forEach((q,i)=>{ const s=status(i); if(s==='dbt') d++; else if(s==='ans') a++; else u++; });
  return {a,d,u,answered:Object.keys(S.ans).length};
}

/* ---------- Layar awal ---------- */
function renderStart(errs={}){
  const u=S.user;
  const f=(id,label,ph,val,extra='')=>`<div class="field${errs[id]?' err':''}"><label for="${id}">${label}</label><input id="${id}" name="${id}" placeholder="${ph}" value="${esc(val)}" autocomplete="off" ${extra}><div class="msg" id="m-${id}">${errs[id]||''}</div></div>`;
  $('#app').innerHTML = `
  <div class="start">
    <section class="hero">
      <span class="badge">Try Out TKA</span>
      <h1>Bahasa Indonesia<br>SMA</h1>
      <p>Latihan soal Tahun 2010 dengan timer, penanda ragu-ragu, dan pembahasan lengkap setelah ujian selesai.</p>
      <div class="facts">
        <div class="fact"><b>${TOTAL}</b><span>soal pilihan ganda</span></div>
        <div class="fact"><b>5</b><span>pilihan jawaban</span></div>
        <div class="fact"><b>0–100</b><span>skala nilai akhir</span></div>
      </div>
    </section>
    <form class="formbox" id="f" novalidate>
      <h2>Isi data peserta</h2>
      <p class="sub">Data ini tampil di layar ujian dan di hasil akhir.</p>
      ${f('nama','Nama Siswa','Contoh: Aditya Pratama',u.nama)}
      <div class="row2">
        ${f('kelas','Kelas','Contoh: XII IPA 2',u.kelas)}
        ${f('peserta','Peserta Didik','No. peserta / NISN',u.peserta)}
      </div>
      ${f('sekolah','Asal Sekolah','Contoh: SMAN 1 Bandar Lampung',u.sekolah)}
      <div class="field"><label for="menit">Durasi ujian</label>
        <select id="menit">${[30,45,60,90,120].map(m=>`<option value="${m}"${String(m)===String(u.menit)?' selected':''}>${m} menit</option>`).join('')}</select></div>
      <button class="btn btn-main" type="submit">Mulai Try Out</button>
      <p class="note">Timer berjalan setelah tombol ditekan dan ujian berakhir otomatis saat waktu habis. Kunci jawaban disusun mandiri dan sebagian soal bisa berbeda dari kunci resmi.</p>
    </form>
  </div>`;
  $('#f').addEventListener('submit', (e)=>{
    e.preventDefault();
    const v = { nama:$('#nama').value.trim(), kelas:$('#kelas').value.trim(), peserta:$('#peserta').value.trim(), sekolah:$('#sekolah').value.trim(), menit:$('#menit').value };
    S.user = v;
    const lab = { nama:'Nama siswa', kelas:'Kelas', peserta:'Peserta didik', sekolah:'Asal sekolah' };
    const er = {};
    ['nama','kelas','peserta','sekolah'].forEach(k=>{ if(!v[k]) er[k] = lab[k]+' wajib diisi.'; });
    if(Object.keys(er).length){ renderStart(er); const first=document.getElementById(Object.keys(er)[0]); if(first) first.focus(); return; }
    startExam();
  });
}

/* ---------- Ujian ---------- */
function startExam(){
  S.screen='exam'; S.idx=0; S.ans={}; S.doubt={}; S.confirm=false; S.auto=false;
  S.startedAt=Date.now(); S.endAt=S.startedAt+Number(S.user.menit)*60000;
  renderExam();
  clearInterval(tick);
  tick = setInterval(onTick, 1000);
}
function onTick(){
  const left = S.endAt - Date.now();
  const el = $('#tm');
  if(el){ el.textContent = fmt(left); el.parentElement.classList.toggle('low', left<=5*60000); }
  if(left<=0){ S.auto=true; finish(); }
}
function renderExam(){
  const q=Q[S.idx], u=S.user, c=counts();
  const initial = (u.nama[0]||'?').toUpperCase();
  const left = S.endAt-Date.now();
  const isLast = S.idx===TOTAL-1;
  $('#app').innerHTML = `
  <div class="top">
    <div class="who"><div class="av">${esc(initial)}</div><div><b>${esc(u.nama)}</b><small>Kelas ${esc(u.kelas)} · ${esc(u.sekolah)} · ${esc(u.peserta)}</small></div></div>
    <div class="timer${left<=5*60000?' low':''}"><small>Sisa waktu</small><b id="tm">${fmt(left)}</b></div>
  </div>
  <div class="exam">
    <section class="card" id="qcard">
      <div class="qhead"><div class="qno">Soal ${q.id} <span>dari ${TOTAL}</span></div>
        ${S.doubt[S.idx]?'<span class="pill w">Ditandai ragu-ragu</span>':''}</div>
      <div class="prog" aria-hidden="true"><i style="width:${c.answered/TOTAL*100}%"></i></div>
      ${q.ctx?`<div class="ctx" tabindex="0" aria-label="Bacaan soal">${q.ctx}</div>`:''}
      <p class="stem">${esc(q.stem)}</p>
      <div class="opts" role="radiogroup" aria-label="Pilihan jawaban">
        ${q.opts.map((o,i)=>`<button type="button" class="opt" role="radio" aria-checked="${S.ans[S.idx]===i}" data-act="pick" data-i="${i}"><span class="l">${LET[i]}</span><span class="t">${o}</span></button>`).join('')}
      </div>
      ${S.ans[S.idx]!==undefined?'<button class="clear" data-act="clear" type="button">Hapus jawaban</button>':''}
      <div class="actions">
        <button class="btn btn-ghost" data-act="prev" ${S.idx===0?'disabled':''}>← Sebelumnya</button>
        <button class="btn btn-dbt" data-act="doubt" aria-pressed="${!!S.doubt[S.idx]}">Ragu-ragu</button>
        ${isLast?'<button class="btn btn-main" data-act="finish">Selesai ✓</button>':'<button class="btn btn-main" data-act="next">Selanjutnya →</button>'}
      </div>
    </section>
    <aside class="side">
      <div class="card">
        <h3>Navigasi soal</h3>
        <div class="stat3"><div class="a"><b>${c.a}</b><small>Dijawab</small></div><div class="d"><b>${c.d}</b><small>Ragu-ragu</small></div><div class="u"><b>${c.u}</b><small>Belum</small></div></div>
        <div class="grid">${Q.map((x,i)=>`<button class="n ${status(i)}${i===S.idx?' cur':''}" data-act="go" data-i="${i}" aria-label="Soal ${x.id}, ${{ans:'sudah dijawab',dbt:'ragu-ragu',un:'belum dijawab'}[status(i)]}"${i===S.idx?' aria-current="true"':''}>${x.id}</button>`).join('')}</div>
